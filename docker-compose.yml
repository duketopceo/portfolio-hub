# Docker Compose for Swarm + local dev
# Usage:
#   Swarm:  docker stack deploy -c docker-compose.yml portfolio
#           (No host ports — Traefik reaches the app on traefik-public:3000.)
#   Local:  docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
services:
  portfolio:
    build:
      context: .
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN}
    image: ghcr.io/duketopceo/portfolio-hub:latest
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - NODE_ENV=production
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        # ── Traefik routing (Host must match the browser hostname or you get 502/404)
        - "traefik.enable=true"
        # Required on Swarm when the task is on multiple networks — without this Traefik
        # often picks the wrong network and you get 502 Bad Gateway.
        - "traefik.docker.network=traefik-public"
        - "traefik.http.routers.portfolio.rule=Host(`luke-the-duke.com`) || Host(`www.luke-the-duke.com`)"
        - "traefik.http.routers.portfolio.entrypoints=websecure"
        - "traefik.http.routers.portfolio.tls.certresolver=cloudflare"
        - "traefik.http.services.portfolio.loadbalancer.server.port=3000"
        # Traefik LB healthcheck (optional): if all backends fail here, Traefik returns 502.
        # Use a fast path; container still has Docker healthcheck below.
        - "traefik.http.services.portfolio.loadbalancer.healthcheck.path=/api/repos"
        - "traefik.http.services.portfolio.loadbalancer.healthcheck.interval=15s"
        - "traefik.http.services.portfolio.loadbalancer.healthcheck.timeout=5s"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/repos"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
