<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luke the Duke Show — Mission Control</title>
  <meta name="description" content="Live companion dashboard for the Luke the Duke Show — economics, politics, philosophy, tech, and more.">
  <meta property="og:title" content="Luke the Duke Show — Mission Control">
  <meta property="og:description" content="Multi-panel Bloomberg-style dashboard for live episode recording.">
  <meta property="og:type" content="website">

  <!-- Fonts -->
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=general-sans@400,500,600&display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/podcast/base.css">
  <link rel="stylesheet" href="/podcast/style.css">
</head>
<body>
  <!-- Stars canvas -->
  <canvas class="stars" id="starsCanvas" aria-hidden="true"></canvas>

  <!-- Header -->
  <header class="header" id="header">
    <a href="https://luke-the-duke.com" target="_blank" rel="noopener noreferrer" class="header__brand" aria-label="Luke the Duke home">
      <svg class="header__logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <circle cx="16" cy="16" r="5" fill="#00d4aa"/>
        <ellipse cx="16" cy="16" rx="14" ry="6" stroke="#00d4aa" stroke-width="1.2" opacity="0.4" transform="rotate(-20 16 16)"/>
        <ellipse cx="16" cy="16" rx="14" ry="6" stroke="#f0a030" stroke-width="1.2" opacity="0.3" transform="rotate(40 16 16)"/>
      </svg>
      <span class="header__title">Luke the Duke</span>
    </a>

    <div class="header__episode" id="headerEpisode">
      <span class="header__ep-badge" id="epBadge">EP 01</span>
      <span class="header__ep-title" id="epTitle">Loading...</span>
      <span class="header__ep-date" id="epDate"></span>
    </div>

    <div class="header__right">
      <nav class="page-nav" id="pageNav" aria-label="Dashboard pages"></nav>
      <div class="social-bar" id="socialBar"></div>
    </div>
  </header>

  <!-- Ticker tape -->
  <div class="ticker-bar" id="tickerBar"></div>

  <!-- Main dashboard -->
  <main class="dashboard" id="dashboard"></main>

  <!-- Footer -->
  <footer class="footer-bar">
    <span class="footer-bar__left" id="footerStatus">LIVE</span>
    <span class="footer-bar__right">
      <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> pages</span>
      <span><kbd>←</kbd><kbd>→</kbd> nav</span>
    </span>
  </footer>

  <script src="/podcast/bundle.min.js"></script>
</body>
</html>
